# Supply-chain hardening: refuse any version published less than 7 days ago.
minimumReleaseAge: 10080
# First-party packages ship on our own schedule and are vetted in-house.
minimumReleaseAgeExclude:
  - '@perawallet/connect'
  - '@perawallet/walletconnect'

# Only these packages may run install scripts.
onlyBuiltDependencies:
  - esbuild
